<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>trpg-replay · 本地验证</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #05070a;
        color: #dfe6f0;
        font: 14px/1.6 "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        display: grid;
        place-items: center;
        padding: 40px 24px;
      }
      .wrap { width: min(1180px, 100%); }
      .head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 14px; }
      .head h1 { font-size: 15px; font-weight: 500; letter-spacing: .28em; margin: 0; color: #8d9aab; }
      .head .hint { font-size: 12px; color: #4d5666; letter-spacing: .1em; }
      .note { margin-top: 16px; font-size: 12px; color: #4d5666; letter-spacing: .06em; }
      .note code { color: #7b8798; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head">
        <h1>TRPG REPLAY</h1>
        <span class="hint">本地验证 · 占位美术</span>
      </div>

      <trpg-replay id="rp" src="/data/replay.json" autoplay></trpg-replay>

      <p class="note">
        空格 播放/暂停 · ←/→ 上一句/下一句 · 鼠标悬停出控制条 · <code>?god=1</code> 打开上帝视角
      </p>
    </div>

    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
